schema = 1
id = "velumbra"
name = "Velumbra"
version = "1.0.0"
api = "0.1"
description = "Warm cinematic lighting: scattered-light sky, volumetric clouds, soft sun shadows, light shafts, reflective waving water and filmic grading."
authors = ["RetrozDev"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Scattering sky and volumetric clouds"

[material]
file = "material.wgsl"
name = "Sunlight, shadows and water"

[vertex]
file = "vertex.wgsl"
name = "Wind and waves"

[weather]
file = "weather.wgsl"
name = "Lit rain and snow"

[reflection]
option = "water_reflections"

[shadow]
resolution = 1536
distance = 128.0
option = "shadows"
resolution_option = "shadow_resolution"
distance_option = "shadow_distance"

[[materials]]
id = 1
sprites = ["block/*_leaves", "block/vine"]

[[materials]]
id = 2
sprites = [
  "block/short_grass",
  "block/fern",
  "block/bush",
  "block/short_dry_grass",
  "block/tall_dry_grass",
  "block/dead_bush",
  "block/firefly_bush",
  "block/*_sapling",
  "block/dandelion",
  "block/poppy",
  "block/blue_orchid",
  "block/allium",
  "block/azure_bluet",
  "block/*_tulip",
  "block/oxeye_daisy",
  "block/cornflower",
  "block/lily_of_the_valley",
  "block/wither_rose",
  "block/torchflower",
  "block/wheat_stage*",
  "block/carrots_stage*",
  "block/potatoes_stage*",
  "block/beetroots_stage*",
  "block/sweet_berry_bush_stage*"
]

[[materials]]
id = 3
sprites = [
  "block/tall_grass_bottom",
  "block/large_fern_bottom",
  "block/sunflower_bottom",
  "block/lilac_bottom",
  "block/rose_bush_bottom",
  "block/peony_bottom"
]

[[materials]]
id = 4
sprites = [
  "block/tall_grass_top",
  "block/large_fern_top",
  "block/sunflower_top",
  "block/lilac_top",
  "block/rose_bush_top",
  "block/peony_top"
]

[[materials]]
id = 5
sprites = ["block/water_still", "block/water_flow"]

[[post]]
file = "post/atmosphere.wgsl"
name = "Fog and light shafts"

[[post]]
file = "post/grade.wgsl"
name = "Bloom and filmic grade"

[[options]]
id = "exposure"
name = "Exposure"
description = "Overall brightness before the filmic curve."
type = "float"
default = 1.0
min = 0.5
max = 2.0
step = 0.05

[[options]]
id = "shadows"
name = "Sun shadows"
description = "Shadow maps cast by terrain, trees and entities."
type = "bool"
default = true

[[options]]
id = "shadow_resolution"
name = "Shadow resolution"
description = "Sharper shadows cost more."
type = "choice"
values = ["1024", "1536", "2048"]
default = "1536"

[[options]]
id = "shadow_distance"
name = "Shadow distance"
description = "How far shadows reach, in blocks."
type = "choice"
values = ["64", "96", "128", "160"]
default = "128"

[[options]]
id = "shadow_softness"
name = "Shadow softness"
description = "Width of the shadow penumbra."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "cloud_quality"
name = "Volumetric clouds"
description = "Ray-marched cumulus clouds. Turn vanilla clouds off in the video settings."
type = "choice"
values = ["Off", "Low", "Medium", "High"]
default = "Medium"

[[options]]
id = "cloud_coverage"
name = "Cloud coverage"
description = "How much of the sky the clouds cover."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "volumetric_light"
name = "Light shafts"
description = "Volumetric sun rays through trees and terrain."
type = "choice"
values = ["Off", "Low", "Medium", "High"]
default = "Medium"

[[options]]
id = "volumetric_strength"
name = "Light shaft strength"
description = "Density of the air the shafts light up."
type = "float"
default = 1.0
min = 0.0
max = 3.0
step = 0.1

[[options]]
id = "fog_density"
name = "Atmospheric fog"
description = "Distance haze and its blue tint."
type = "float"
default = 1.0
min = 0.0
max = 3.0
step = 0.1

[[options]]
id = "water_waves"
name = "Water waves"
description = "Moving waves and their normals."
type = "bool"
default = true

[[options]]
id = "water_reflections"
name = "Water reflections"
description = "Mirror reflections of terrain on water (an extra render of the world)."
type = "bool"
default = true

[[options]]
id = "waving_plants"
name = "Waving plants"
description = "Leaves, grass and flowers sway in the wind."
type = "bool"
default = true

[[options]]
id = "bloom"
name = "Bloom"
description = "Glow around bright light; 0 turns it off."
type = "float"
default = 0.6
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "saturation"
name = "Saturation"
description = "Colour intensity of the final picture."
type = "float"
default = 1.1
min = 0.5
max = 1.6
step = 0.05

[[options]]
id = "warmth"
name = "Warmth"
description = "Warm colour grade; 0 is neutral."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "vignette"
name = "Vignette"
description = "Darkened screen corners."
type = "bool"
default = true
